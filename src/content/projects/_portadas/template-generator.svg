<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a1d"/>
      <stop offset="1" stop-color="#1a1035"/>
    </linearGradient>
    <radialGradient id="react" cx="0.15" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#61dafb" stop-opacity="0.25"/><stop offset="1" stop-color="#61dafb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vue" cx="0.9" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#42b883" stop-opacity="0.25"/><stop offset="1" stop-color="#42b883" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#fondo)"/>
  <rect width="1600" height="900" fill="url(#react)"/>
  <rect width="1600" height="900" fill="url(#vue)"/>

  <!-- Terminal -->
  <g filter="url(#sombra)">
    <rect x="120" y="130" width="880" height="620" rx="20" fill="#0d1117" stroke="#30363d"/>
    <rect x="120" y="130" width="880" height="54" rx="20" fill="#161b22"/>
    <rect x="120" y="160" width="880" height="24" fill="#161b22"/>
    <circle cx="160" cy="157" r="8" fill="#ef4444"/><circle cx="188" cy="157" r="8" fill="#f59e0b"/><circle cx="216" cy="157" r="8" fill="#22c55e"/>
    <text x="560" y="164" fill="#8b949e" font-size="18" text-anchor="middle">~/projects — zsh</text>

    <g font-size="24">
      <text x="160" y="250"><tspan fill="#7ee787">❯</tspan><tspan fill="#e6edf3"> generate</tspan></text>
      <text x="160" y="310"><tspan fill="#58a6ff">?</tspan><tspan fill="#e6edf3" font-weight="700"> What project template would you</tspan></text>
      <text x="189" y="344" fill="#e6edf3" font-weight="700">like to generate?</text>
      <text x="160" y="394"><tspan fill="#61dafb">❯ vite-react-tailwind-template</tspan></text>
      <text x="189" y="432" fill="#8b949e">vite-vue-tailwind-template</text>
      <text x="160" y="500"><tspan fill="#58a6ff">?</tspan><tspan fill="#e6edf3" font-weight="700"> Project name:</tspan><tspan fill="#d2a8ff"> my-app</tspan></text>
      <text x="160" y="568"><tspan fill="#7ee787">❯</tspan><tspan fill="#e6edf3"> cd my-app &amp;&amp; npm install</tspan></text>
      <text x="160" y="626"><tspan fill="#7ee787">❯</tspan><tspan fill="#e6edf3"> npm run dev</tspan><tspan fill="#e6edf3">▌</tspan></text>
    </g>
  </g>

  <!-- Árbol de archivos generado -->
  <g filter="url(#sombra)" font-size="22">
    <rect x="1070" y="210" width="410" height="420" rx="20" fill="#161b22" stroke="#30363d"/>
    <text x="1104" y="262" fill="#8b949e" font-size="18" font-family="Inter, -apple-system, sans-serif" font-weight="600" letter-spacing="2">GENERATED</text>
    <text x="1104" y="314" fill="#e6edf3" font-weight="700">my-app/</text>
    <text x="1104" y="356" fill="#8b949e">├─ <tspan fill="#e6edf3">index.html</tspan></text>
    <text x="1104" y="394" fill="#8b949e">├─ <tspan fill="#e6edf3">package.json</tspan></text>
    <text x="1104" y="432" fill="#8b949e">├─ <tspan fill="#38bdf8">tailwind.config.js</tspan></text>
    <text x="1104" y="470" fill="#8b949e">├─ <tspan fill="#facc15">vite.config.js</tspan></text>
    <text x="1104" y="508" fill="#8b949e">└─ <tspan fill="#e6edf3">src/</tspan></text>
    <text x="1144" y="546" fill="#8b949e">├─ <tspan fill="#61dafb">App.jsx</tspan></text>
    <text x="1144" y="584" fill="#8b949e">└─ <tspan fill="#61dafb">main.jsx</tspan></text>
  </g>

  <!-- Logos simplificados -->
  <g transform="translate(1200 720)" fill="none" stroke="#61dafb" stroke-width="5">
    <ellipse rx="56" ry="21"/><ellipse rx="56" ry="21" transform="rotate(60)"/><ellipse rx="56" ry="21" transform="rotate(-60)"/>
    <circle r="9" fill="#61dafb" stroke="none"/>
  </g>
  <g transform="translate(1340 685)">
    <path d="M0 0 h28 l22 38 l22 -38 h28 l-50 86 z" fill="#42b883"/>
    <path d="M28 0 h16 l6 10 l6 -10 h16 l-22 38 z" fill="#35495e"/>
  </g>
</svg>
