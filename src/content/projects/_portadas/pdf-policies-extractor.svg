<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1210"/>
      <stop offset="1" stop-color="#2a1a14"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.55" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8a48a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#fondo)"/>
  <rect width="1600" height="900" fill="url(#brillo)"/>

  <!-- Pila de PDFs -->
  <g filter="url(#sombra)">
    <rect x="128" y="250" width="300" height="400" rx="16" fill="#e7e5e4" transform="rotate(-7 278 450)"/>
    <rect x="128" y="250" width="300" height="400" rx="16" fill="#f5f5f4" transform="rotate(-3 278 450)"/>
    <rect x="128" y="250" width="300" height="400" rx="16" fill="#ffffff"/>
    <rect x="156" y="282" width="80" height="34" rx="6" fill="#dc2626"/>
    <text x="196" y="306" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">PDF</text>
    <text x="156" y="358" fill="#1c1917" font-size="22" font-weight="800">PÓLIZA DE AUTO</text>
    <text x="156" y="386" fill="#78716c" font-size="15">Carátula · Seguro de automóviles</text>
    <g fill="#e7e5e4">
      <rect x="156" y="414" width="244" height="10" rx="5"/><rect x="156" y="438" width="200" height="10" rx="5"/>
      <rect x="156" y="462" width="230" height="10" rx="5"/><rect x="156" y="500" width="110" height="10" rx="5"/>
      <rect x="290" y="500" width="110" height="10" rx="5"/><rect x="156" y="524" width="110" height="10" rx="5"/>
      <rect x="290" y="524" width="110" height="10" rx="5"/><rect x="156" y="562" width="244" height="10" rx="5"/>
    </g>
    <rect x="156" y="596" width="244" height="30" rx="6" fill="#fef3c7"/>
    <text x="168" y="617" fill="#92400e" font-size="15" font-weight="700">PRIMA TOTAL  $ 12,480.00</text>
  </g>
  <text x="278" y="716" fill="#d6d3d1" font-size="18" text-anchor="middle">Hasta 50 PDF por lote</text>

  <!-- Pipeline -->
  <g font-size="19">
    <path d="M450 450 H540" stroke="#e8a48a" stroke-width="3" marker-end="url(#flecha)"/>
    <g filter="url(#sombra)">
      <rect x="555" y="250" width="420" height="104" rx="18" fill="#292524" stroke="#57534e"/>
      <circle cx="600" cy="302" r="22" fill="#44403c"/><text x="600" y="309" fill="#fafaf9" font-weight="800" text-anchor="middle">1</text>
      <text x="640" y="292" fill="#fafaf9" font-weight="700">Reglas por aseguradora</text>
      <text x="640" y="322" fill="#a8a29e" font-size="16">Detecta la plantilla y extrae con regex</text>

      <rect x="555" y="398" width="420" height="104" rx="18" fill="#292524" stroke="#57534e"/>
      <circle cx="600" cy="450" r="22" fill="#44403c"/><text x="600" y="457" fill="#fafaf9" font-weight="800" text-anchor="middle">2</text>
      <text x="640" y="440" fill="#fafaf9" font-weight="700">Validaciones de negocio</text>
      <text x="640" y="470" fill="#a8a29e" font-size="16">¿Cuadran los montos? ¿Falta algo?</text>

      <rect x="555" y="546" width="420" height="104" rx="18" fill="#3b221a" stroke="#d97757"/>
      <g transform="translate(600 598)" fill="#d97757">
        <rect x="-3" y="-20" width="6" height="40" rx="3"/>
        <rect x="-3" y="-20" width="6" height="40" rx="3" transform="rotate(30)"/>
        <rect x="-3" y="-18" width="6" height="36" rx="3" transform="rotate(60)"/>
        <rect x="-3" y="-20" width="6" height="40" rx="3" transform="rotate(90)"/>
        <rect x="-3" y="-17" width="6" height="34" rx="3" transform="rotate(120)"/>
        <rect x="-3" y="-20" width="6" height="40" rx="3" transform="rotate(150)"/>
      </g>
      <text x="640" y="588" fill="#fafaf9" font-weight="700">Claude · tool use</text>
      <text x="640" y="618" fill="#e8a48a" font-size="16">Sólo los campos faltantes o dudosos</text>
    </g>
    <path d="M765 354 V392" stroke="#78716c" stroke-width="3" marker-end="url(#flecha)"/>
    <path d="M765 502 V540" stroke="#78716c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#flecha)"/>
    <path d="M990 450 H1060" stroke="#e8a48a" stroke-width="3" marker-end="url(#flecha)"/>
  </g>

  <!-- JSON de salida -->
  <g filter="url(#sombra)" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
    <rect x="1075" y="180" width="420" height="540" rx="18" fill="#0c0a09" stroke="#44403c"/>
    <text x="1105" y="226" fill="#a8a29e" font-size="15" font-family="Inter, -apple-system, sans-serif" font-weight="600" letter-spacing="2">POST /v1/extract → JSON</text>
    <text x="1105" y="270" fill="#e7e5e4">{</text>
    <text x="1129" y="304"><tspan fill="#93c5fd">"numero_poliza"</tspan><tspan fill="#e7e5e4">: </tspan><tspan fill="#86efac">"AU-118204"</tspan></text>
    <text x="1129" y="338"><tspan fill="#93c5fd">"aseguradora"</tspan><tspan fill="#e7e5e4">: </tspan><tspan fill="#86efac">"SEGUROS MX"</tspan></text>
    <text x="1129" y="372"><tspan fill="#93c5fd">"vigencia_inicio"</tspan><tspan fill="#e7e5e4">: </tspan><tspan fill="#86efac">"2026-03-01"</tspan></text>
    <text x="1129" y="406"><tspan fill="#93c5fd">"moneda"</tspan><tspan fill="#e7e5e4">: </tspan><tspan fill="#86efac">"MXN"</tspan></text>
    <text x="1129" y="440"><tspan fill="#93c5fd">"prima_neta"</tspan><tspan fill="#e7e5e4">: </tspan><tspan fill="#fdba74">10200</tspan></text>
    <text x="1129" y="508"><tspan fill="#93c5fd">"iva"</tspan><tspan fill="#e7e5e4">: </tspan><tspan fill="#fdba74">1721.38</tspan></text>
    <text x="1129" y="542"><tspan fill="#93c5fd">"prima_total"</tspan><tspan fill="#e7e5e4">: </tspan><tspan fill="#fdba74">12480</tspan></text>
    <text x="1129" y="474"><tspan fill="#93c5fd">"derechos_poliza"</tspan><tspan fill="#e7e5e4">: </tspan><tspan fill="#fdba74">558.62</tspan></text>
    <text x="1129" y="576"><tspan fill="#93c5fd">"metodo"</tspan><tspan fill="#e7e5e4">: </tspan><tspan fill="#86efac">"reglas+ia"</tspan></text>
    <text x="1129" y="610"><tspan fill="#93c5fd">"advertencias"</tspan><tspan fill="#e7e5e4">: []</tspan></text>
    <text x="1105" y="644" fill="#e7e5e4">}</text>
    <rect x="1105" y="666" width="168" height="32" rx="16" fill="#14532d"/>
    <text x="1189" y="688" fill="#86efac" font-size="15" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="700">✓ Pydantic</text>
  </g>

  <!-- Stack -->
  <g font-size="20" font-weight="600">
    <rect x="555" y="760" width="132" height="44" rx="22" fill="#009688" fill-opacity="0.18" stroke="#009688" stroke-opacity="0.7"/><text x="621" y="789" fill="#5eead4" text-anchor="middle">FastAPI</text>
    <rect x="701" y="760" width="116" height="44" rx="22" fill="#3776ab" fill-opacity="0.2" stroke="#3776ab" stroke-opacity="0.7"/><text x="759" y="789" fill="#93c5fd" text-anchor="middle">Python</text>
    <rect x="831" y="760" width="144" height="44" rx="22" fill="#d97757" fill-opacity="0.2" stroke="#d97757" stroke-opacity="0.8"/><text x="903" y="789" fill="#f2b8a2" text-anchor="middle">Claude API</text>
  </g>
</svg>
